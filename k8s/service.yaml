apiVersion: v1
kind: Service
metadata:
  name: invoice-billing-service
  namespace: invoice-billing
  labels:
    app: ai-invoice-billing
    component: backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: ai-invoice-billing
    component: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
