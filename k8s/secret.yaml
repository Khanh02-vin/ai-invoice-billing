# Secret template for invoice-billing.
# DO NOT commit real secrets. Replace placeholder values before apply.
# Recommended: use sealed-secrets (kubeseal) or external-secrets (ESO + Vault/AWS SM).
# Example with sealed-secrets:
#   kubeseal --format yaml < k8s/secret.yaml > k8s/sealed-secret.yaml
# Example with external-secrets: replace kind with ExternalSecret and set store.
apiVersion: v1
kind: Secret
metadata:
  name: invoice-billing-secrets
  namespace: invoice-billing
  labels:
    app: ai-invoice-billing
  annotations:
    description: "Template - replace JWT_SECRET before applying. Use sealed-secrets or external-secrets in production."
type: Opaque
data:
  # echo -n "change-me-please-generate-strong-random-32+chars" | base64 -w0
  JWT_SECRET: Y2hhbmdlLW1lLXBsZWFzZS1nZW5lcmF0ZS1zdHJvbmctcmFuZG9tLTMyK2NoYXJz
  # Optional: add LLM_API_KEY here if needed
  # LLM_API_KEY: ""  # base64 encoded value
stringData:
  # Alternative stringData (plain text) - uncomment to use instead of data
  # JWT_SECRET: "change-me-please-generate-strong-random-32+chars"
