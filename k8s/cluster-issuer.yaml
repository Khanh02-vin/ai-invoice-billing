# cert-manager ClusterIssuer — Let's Encrypt production.
#
# Cần cert-manager đã cài trong cluster:
#   kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.15.0/cert-manager.yaml
#
# Sau khi apply file này, Ingress có annotation
#   cert-manager.io/cluster-issuer: letsencrypt-prod
# sẽ tự xin cert qua ACME HTTP-01. Email dưới đây phải là email THẬT của bạn
# (Let's Encrypt gửi cảnh báo hết hạn + mất cert về đó).
#
# Test trước bằng staging để tránh rate-limit: đổi server + name sang
# letsencrypt-staging.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@example.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
