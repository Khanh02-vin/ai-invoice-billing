apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoice-billing-backend
  namespace: invoice-billing
  labels:
    app: ai-invoice-billing
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-invoice-billing
      component: backend
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: ai-invoice-billing
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ai-invoice-billing-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: invoice-billing-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: invoice-billing-secrets
                  key: JWT_SECRET
            # Optional LLM API key from secret (uncomment if needed)
            # - name: LLM_API_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: invoice-billing-secrets
            #       key: LLM_API_KEY
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: invoice-data
              mountPath: /app/data
      volumes:
        - name: invoice-data
          persistentVolumeClaim:
            claimName: invoice-data-pvc
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: invoice-data-pvc
  namespace: invoice-billing
  labels:
    app: ai-invoice-billing
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # storageClassName: standard  # uncomment and set per cluster (e.g., gp2, standard)
