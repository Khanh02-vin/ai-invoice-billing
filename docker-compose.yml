# docker-compose for ai-invoice-billing Phase 3-4 / v3.0.0.
# Backend (FastAPI) + frontend (Vite dev server) + persistent SQLite volume.
#
# Usage:
#   docker compose up --build
#   docker compose run --rm backend pytest -q
#
# Production secrets are read from .env (git-ignored). Copy .env.example → .env
# and edit before running in production.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-invoice-billing-backend:latest
    container_name: invoice-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      OPEN_REGISTRATION: ${OPEN_REGISTRATION:-0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      STORAGE_DIR: /app/data/storage
      PORT: "8000"
      BILLING_PROVIDER: ${BILLING_PROVIDER:-mock}  # mock|stripe|paddle (mock is safe non-secret default)
    volumes:
      - invoice-data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  frontend:
    image: node:20-alpine
    container_name: invoice-frontend
    working_dir: /app
    restart: unless-stopped
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  invoice-data:
    driver: local
  frontend-node-modules:
    driver: local
