# docker-compose for ai-invoice-billing Phase 3-4 / v3.0.0.
# Backend (FastAPI) + Celery worker + Redis + frontend.
# SQLite and uploaded files share one persistent volume; do not scale backend horizontally.
#
# Usage:
#   docker compose up --build
#   docker compose run --rm backend pytest -q
#
# Production secrets are read from .env (git-ignored). Copy .env.example → .env
# and edit before running in production.

services:
  redis:
    image: redis:7-alpine
    container_name: invoice-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-invoice-billing-backend:latest
    container_name: invoice-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      OPEN_REGISTRATION: ${OPEN_REGISTRATION:-0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      STORAGE_DIR: /app/data/storage
      DATABASE_PATH: /app/data/invoices.db
      REDIS_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      WORKER_ENABLED: "0"
      PORT: "8000"
      BILLING_PROVIDER: ${BILLING_PROVIDER:-mock}  # mock|stripe|paddle (mock is safe non-secret default)
    volumes:
      - invoice-data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    # SQLite is single-writer: keep exactly one backend service instance.
    deploy:
      replicas: 1

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-invoice-billing-backend:latest
    container_name: invoice-worker
    restart: unless-stopped
    command: celery -A src.workers.celery_app worker -l info -Q extraction,billing,pdf,default -c 2
    healthcheck:
      disable: true
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      STORAGE_DIR: /app/data/storage
      REDIS_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      WORKER_ENABLED: "1"
    volumes:
      - invoice-data:/app/data
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    container_name: invoice-frontend
    working_dir: /app
    restart: unless-stopped
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  invoice-data:
    driver: local
  redis-data:
    driver: local
  frontend-node-modules:
    driver: local
