# docker-compose cho Quanh Ta: backend FastAPI (SQLite) + frontend Caddy.
# SQLite là single-writer → không scale backend ngang.
#
# Dùng:
#   docker compose up --build
#   docker compose run --rm backend pytest -q
#
# Secrets đọc từ .env (git-ignored). Copy .env.example → .env rồi sửa.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: quanhta-backend:latest
    container_name: quanhta-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      OPEN_REGISTRATION: ${OPEN_REGISTRATION:-0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      DATABASE_PATH: /app/data/spends.db
      PORT: "8000"
    volumes:
      - quanhta-data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      replicas: 1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: quanhta-frontend:latest
    container_name: quanhta-frontend
    restart: unless-stopped
    environment:
      # ":80" = HTTP thuần. Đặt domain thật (VD quanhta.example.com) để Caddy tự
      # lấy + gia hạn cert Let's Encrypt — cần port 80/443 trỏ về máy này và
      # firewall mở. Không cần certbot riêng.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      BACKEND_UPSTREAM: backend:8000
    networks:
      default:
        # IP tĩnh cho Caddy: backend chỉ tin X-Forwarded-For đến từ đúng IP này
        # (RATE_LIMIT_TRUSTED_PROXIES trong .env) để rate limit theo IP người
        # dùng thay vì gộp cả app vào một bucket.
        ipv4_address: 172.28.0.10
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Caddy lưu cert + account Let's Encrypt trong /data. Mất volume này thì
      # phải xin lại cert (dễ dính rate-limit) — đừng xoá.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy

volumes:
  quanhta-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local

# Subnet cố định — phải khớp IP tĩnh của frontend (Caddy) ở trên và với
# RATE_LIMIT_TRUSTED_PROXIES trong .env. Đổi subnet thì đổi cả hai nơi kia.
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
