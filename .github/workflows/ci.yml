# CI for ai-invoice-billing Phase 0+1 milestone.
# Runs on push/PR: lint checks + full pytest suite.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest

    env:
      APP_ENV: test
      OPEN_REGISTRATION: 1
      JWT_SECRET: ci-test-secret-not-for-production-32bytes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest anyio

      - name: Run tests
        run: |
          python -m pytest -q --tb=short

      - name: Verify production config fail-fast
        run: |
          # Backend must refuse to start in production without explicit JWT_SECRET
          if APP_ENV=production JWT_SECRET= python -c "import sys; sys.path.insert(0,'src'); from config import get_settings; get_settings().ensure_production_readiness()" 2>/dev/null; then
            echo "ERROR: production should have failed without JWT_SECRET"
            exit 1
          else
            echo "OK: production correctly refused default JWT_SECRET"
          fi
        env:
          APP_ENV: production
          JWT_SECRET: dev-secret-change-me-please-32bytes-min

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
