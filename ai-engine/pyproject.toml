[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "invoice-ai"
version = "0.1.0"
description = "Portable bilingual invoice extraction with OCR and optional LLM fallback"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.0",
  "pdfplumber>=0.10",
  "PyPDF2>=3.0",
]

[project.optional-dependencies]
llm = ["openai>=1.0"]
ocr-tesseract = ["Pillow>=10.0", "pytesseract>=0.3.10"]
ocr-paddle = ["Pillow>=10.0", "numpy>=1.26", "paddleocr>=2.7"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
all = ["openai>=1.0", "Pillow>=10.0", "pytesseract>=0.3.10", "numpy>=1.26", "paddleocr>=2.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_ai"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
