[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-billing"
version = "3.0.0"
description = "Invoice & Billing System with AI extraction, timeline, and smart suggestions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core API
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pydantic-extra-types>=2.6.0",

    # Database: SQLModel (SQLAlchemy + Pydantic)
    "sqlmodel>=0.0.14",
    "aiosqlite>=0.19.0",
    "alembic>=1.12.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "pyotp>=2.9.0",

    # Background jobs: arq (async Redis queue) instead of Celery
    "arq>=0.23.0",
    "redis>=5.0.0",

    # Vector search: ChromaDB (embedded)
    "chromadb>=0.5.0",

    # OCR/Extraction
    "pdfplumber>=0.11.0",
    "PyPDF2>=3.0.0",
    "pypdfium2>=4.0.0",
    "pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "opencv-python-headless>=4.9.0",
    # marker-pdf for layout-aware PDF extraction (requires Rust, optional)
    # "marker-pdf>=0.1.0",

    # Email/IMAP
    "aioimaplib>=0.9.0",
    "aiosmtplib>=2.0.0",

    # Web Push
    "pywebpush>=2.0.0",

    # HTTP client for LLM
    "httpx>=0.27.0",
    "openai>=1.30.0",

    # Observability
    "prometheus-client>=0.19.0",
    "structlog>=24.0.0",

    # Validation/Utils
    "email-validator>=2.1.0",
    "python-dateutil>=2.9.0",
    "python-slugify>=8.0.0",

    # Testing
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Optional: marker-pdf (requires Rust toolchain)
marker = ["marker-pdf>=0.1.0"]
# Optional: paddleocr for better OCR
paddleocr = ["paddleocr>=2.8.0", "numpy>=1.26.0"]
# Development tools
dev = [
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0",
    "pytest-watch>=4.2.0",
]
# All optional
all = [
    "marker-pdf>=0.1.0",
    "paddleocr>=2.8.0",
    "numpy>=1.26.0",
]

[project.scripts]
invoice-api = "src.app:main"
invoice-worker = "src.workers.celery_app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.ruff]
target-version = "py312"
line-length = 100
select = [
    "E", "F", "I", "N", "W", "UP", "B", "C4", "PT", "SIM", "TID", "PYI", "RUF", "PERF", "PD", "PGH", "PL", "TRY", "NPY", "RET", "ASYNC", "ARG", "PTH", "ERA", "FLY", "TCH", "INT", "RSE", "B004", "B006", "B007", "B008", "B009", "B011", "B012", "B013", "B014", "B015",
]
ignore = []
per-file-ignores = {}

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_optional = true
check_untyped_defs = true
enable_error_code = ["ignore-without-code"]
exclude = ["migrations", "dist", "build", ".venv", "node_modules", "frontend/node_modules"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:uvicorn",
    "ignore::DeprecationWarning:pydantic",
    "ignore::DeprecationWarning:sqlalchemy",
]

[tool.alembic]
script_location = "migrations"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]